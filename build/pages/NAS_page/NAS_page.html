<!DOCTYPE html>
<html lang="en" e>
    <head>
        <link rel="stylesheet" type="text/css" href="NAS_page_style.css">
        <title>NAS</title>
        <meta charset="UTF-8">
    </head>

    <body style="background-color: gray;">
        <div class="page-body">
            <div class="top-bar">
                Home Server    Version <span id="versionField" class="varsion-field"></span>
            </div>
            <div class="sub-top-bar">
                <button id="buttonMainPage" class="sub-top-bar-button" onclick="mainPageOnClick()">Main Page</button>
                <button id="buttonLogin" onclick="logoutButtonOnClick()" class="login-button">Logout</button>
                <span id="paragrahLoggedInAs" class="logged-in-as-paragraph"></span>
            </div>
            
            <div class="page-main-body">
                
                <div class="NAS-window-outer">
                    <div class="NAS-top-bar">
                        <div class="NAS-top-bar-front">
                            <button id="NAS-return-button" class="NAS-return-button" onclick="backToParent()">&lt;</button>
                            <span id="NAS-path-span" class="NAS-path-span"></span>
                        </div>
                        <div class="NAS-top-bar-back">
                            <button id="NAS-mkdir-button" class="NAS-mkdir-button" onclick="newDirOnClick()">New directory</button>
                        </div>

                    </div>
                    <div class="NAS-window-inner" id="NAS-window-inner">

                    </div>
                </div>
            </div>

        </div>

        <dialog id="dirNameDialog">
            <form method="dialog">
                <label>
                    Directory name:
                    <input id="dirNameField" type="text">
                </label>

                <button value="cancel">Cancel</button>
                <button value="ok">OK</button>
            </form>
        </dialog>


    </body>

    <script src="NAS_page.js"></script>

</html>
