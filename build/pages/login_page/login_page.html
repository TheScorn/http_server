<!DOCTYPE html>
<html lang="en" e>
    <head>
        <link rel="stylesheet" type="text/css" href="login_page_style.css">
        <title>Login</title>
        <meta charset="UTF-8">
    </head>
    
    <body style="background-color: gray;">
        <div class="page-body">
            <div class="top-bar">
                Home Server    Version <span id="versionField" class="varsion-field"></span>
                
            </div>

            <div class="sub-top-bar">
                <button id="buttonMainPage" class="sub-top-bar-button" onclick="mainPageOnClick()">Main Page</button>
                <span id="paragraphLogintitle" class="login-title-paragraph">Login Form</span>
            </div>

            <div class="page-main-body">
                <div id="formDiv" class="form-div">
                    <form id="loginForm" class="login-form">
                        <div id="usernameField" class="field">
                            <label>Login:</label>
                            <input id="login" name="login" type="text" placeholder="Your login...">
                        </div>
                        <div id="passwordField" class="field">
                            <label>Password:</label>
                            <input  id="password" name="password" type="password" placeholder="Your password...">
                        </div>
                        <a id="sendFormButton" class="send-form-button" href="login_page.html" onclick="sendLoginInfo(); return false">Login</a>
                    </form>
                </div>
            </div>
            

        </div>

        <script src="login_page.js"></script>

    </body>
</html>
